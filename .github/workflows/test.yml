name: Tests

on:
  push:
  pull_request:

jobs:
  shell-and-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Syntax and content checks
        run: bash tests/test-syntax.sh

      - name: Toggle lifecycle and audio checks
        run: bash tests/test-toggle.sh

      - name: Setup and uninstall checks
        run: bash tests/test-setup-execute.sh
